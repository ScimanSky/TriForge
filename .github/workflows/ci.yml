name: CI

# Runs on pull requests only, and each job only when its part of the repo
# changed, to keep Actions usage low. Main is covered because every change
# reaches it through a pull request that already ran these checks.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.diff.outputs.android }}
      garmin: ${{ steps.diff.outputs.garmin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          files=$(git diff --name-only "$BASE...$HEAD")
          echo "$files"
          workflow=false
          if echo "$files" | grep -q '^\.github/workflows/'; then workflow=true; fi
          if $workflow || echo "$files" | grep -q '^android/'; then
            echo "android=true" >> "$GITHUB_OUTPUT"
          else
            echo "android=false" >> "$GITHUB_OUTPUT"
          fi
          if $workflow || echo "$files" | grep -q '^garmin-service/'; then
            echo "garmin=true" >> "$GITHUB_OUTPUT"
          else
            echo "garmin=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android app
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug build
        run: ./gradlew :domain:test :app:testDebugUnitTest :app:assembleDebug --stacktrace

  garmin-service:
    name: Garmin service
    needs: changes
    if: needs.changes.outputs.garmin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: garmin-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: garmin-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
